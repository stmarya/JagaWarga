services:
  app:
    build: .
    environment:
      NODE_ENV: production
      APP_VERSION: 0.13.0-rc.2
      APP_URL: http://127.0.0.1:${APP_PORT:-3000}
      ADMIN_METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:?Run npm run local:env first}
      REDIS_URL: redis://redis:6379
      RUNTIME_TOPOLOGY: distributed
      ALLOW_RISKY_FEATURES: "false"
      FEATURE_COMMUNITY_REPORTING: "false"
      FEATURE_FILE_UPLOAD: "false"
      FEATURE_URL_SUBMISSION: "false"
      FEATURE_PREMIUM_PROVIDERS: ${FEATURE_PREMIUM_PROVIDERS:-false}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      FEATURE_EXTERNAL_NOTIFICATIONS: "false"
      FEATURE_ORGANIZATION_WORKSPACES: "false"
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: ["/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    restart: unless-stopped
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }
