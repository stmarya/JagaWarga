services:
  app:
    build: .
    environment:
      NODE_ENV: production
      APP_VERSION: 0.4.0
    ports: ["3000:3000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jagawarga
      POSTGRES_USER: jagawarga
      POSTGRES_PASSWORD: local-development-only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jagawarga"], interval: 10s, timeout: 3s, retries: 5 }
volumes:
  postgres-data: