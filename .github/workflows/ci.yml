name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm test
      - run: npm run test:launch-gate
      - run: npm run build
      - run: node -e "JSON.parse(require('fs').readFileSync('public/openapi.json')); JSON.parse(require('fs').readFileSync('public/launch-status.json')); JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
