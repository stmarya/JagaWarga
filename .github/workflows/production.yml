name: Production promotion control

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag (for example v0.12.1)
        required: true
        type: string
      image_ref:
        description: Signed GHCR image reference pinned by sha256 digest
        required: true
        type: string
      staging_evidence_url:
        description: HTTPS URL of the successful staging verification evidence
        required: true
        type: string
      target_url:
        description: HTTPS production URL used for post-deployment verification
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:launch-gate
      - run: npm run test:openapi
      - run: npm run build
      - name: Verify external launch evidence
        env:
          LAUNCH_ATTESTATIONS_JSON: ${{ secrets.LAUNCH_ATTESTATIONS_JSON }}
        run: npm run launch:gate
      - name: Validate immutable release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_REF: ${{ inputs.image_ref }}
          STAGING_EVIDENCE_URL: ${{ inputs.staging_evidence_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          [[ "$IMAGE_REF" =~ ^ghcr\.io/stmarya/jagawarga@sha256:[a-f0-9]{64}$ ]]
          [[ "$STAGING_EVIDENCE_URL" =~ ^https:// ]]
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify keyless release signature
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: >-
          cosign verify "$IMAGE_REF"
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          --certificate-identity-regexp='^https://github.com/stmarya/JagaWarga/.github/workflows/release.yml@refs/tags/v'
      - name: Scan promoted image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image_ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Post-deployment digest-aware preflight
        env:
          BASE_URL: ${{ inputs.target_url }}
          ADMIN_METRICS_TOKEN: ${{ secrets.ADMIN_METRICS_TOKEN }}
          IMAGE_REF: ${{ inputs.image_ref }}
        shell: bash
        run: |
          export EXPECTED_IMAGE_DIGEST="${IMAGE_REF##*@}"
          npm run preflight
