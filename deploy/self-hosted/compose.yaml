services:
  proxy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

  app:
    image: ${IMAGE_REF:?Set immutable IMAGE_REF}
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.12.0}
      APP_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      ADMIN_METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:?Set ADMIN_METRICS_TOKEN}
      DATABASE_URL: postgresql://jagawarga:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/jagawarga
      REDIS_URL: redis://redis:6379
      ALLOW_RISKY_FEATURES: "false"
      FEATURE_COMMUNITY_REPORTING: "false"
      FEATURE_FILE_UPLOAD: "false"
      FEATURE_URL_SUBMISSION: "false"
      FEATURE_PREMIUM_PROVIDERS: ${FEATURE_PREMIUM_PROVIDERS:-false}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      FEATURE_EXTERNAL_NOTIFICATIONS: "false"
      FEATURE_ORGANIZATION_WORKSPACES: "false"
      DISABLE_CLOUDFLARE_DNS: ${DISABLE_CLOUDFLARE_DNS:-false}
      DISABLE_GOOGLE_DNS: ${DISABLE_GOOGLE_DNS:-false}
    expose: ["3000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [edge, data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: ["/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jagawarga
      POSTGRES_USER: jagawarga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagawarga"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data: