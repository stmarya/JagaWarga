services:
  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

  app:
    image: ${IMAGE_REF:?Set immutable IMAGE_REF}
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.13.0-rc.2}
      APP_IMAGE_DIGEST: ${APP_IMAGE_DIGEST:?Set APP_IMAGE_DIGEST}
      APP_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      ADMIN_METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:?Set ADMIN_METRICS_TOKEN}
      REDIS_URL: redis://redis:6379
      RUNTIME_TOPOLOGY: distributed
      ALLOW_RISKY_FEATURES: "false"
      FEATURE_COMMUNITY_REPORTING: "false"
      FEATURE_FILE_UPLOAD: "false"
      FEATURE_URL_SUBMISSION: "false"
      FEATURE_PREMIUM_PROVIDERS: ${FEATURE_PREMIUM_PROVIDERS:-false}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      FEATURE_EXTERNAL_NOTIFICATIONS: "false"
      FEATURE_ORGANIZATION_WORKSPACES: "false"
      DISABLE_CLOUDFLARE_DNS: ${DISABLE_CLOUDFLARE_DNS:-false}
      DISABLE_GOOGLE_DNS: ${DISABLE_GOOGLE_DNS:-false}
    expose: ["3000"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }
    networks: [edge, data]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: ["/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
